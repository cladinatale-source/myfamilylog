<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Family Log</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F172A; --card: #1E293B; --primary: #6366F1; --text: #F8FAFC;
    --text-muted: #94A3B8; --input-bg: #334155; --success: #10B981;
    --warning: #F59E0B; --danger: #EF4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text);
    margin: 0; padding: 15px; display: flex; justify-content: center;
  }
  .container { width: 100%; max-width: 460px; }

  #banner {
    padding: 9px; text-align: center; border-radius: 30px; margin-bottom: 15px;
    font-size: 12px; font-weight: 800; display: none; background: var(--primary); color: #fff;
  }
  #banner.err { background: var(--danger); }
  #banner.ok  { background: var(--success); }

  .page { display: none; } .page.active { display: block; }

  .card {
    background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 15px;
    border: 1px solid rgba(255,255,255,0.05); position: relative;
  }
  .card h2 { margin: 0; font-size: 17px; }
  .menu-card { cursor: pointer; }

  .btn-main {
    background: var(--primary); color: #fff; border: none; width: 100%; padding: 16px;
    border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 15px;
  }
  .btn-main:disabled { opacity: .5; }
  .btn-back {
    background: var(--input-bg); color: var(--text); border: none; padding: 10px 18px;
    border-radius: 12px; margin-bottom: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-sync {
    background: var(--input-bg); color: #fff; border: none; padding: 9px 15px;
    border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer;
  }
  label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
  input, select {
    width: 100%; max-width: 100%; padding: 14px; border-radius: 12px;
    border: 1px solid var(--input-bg); background: var(--input-bg); color: #fff;
    margin: 8px 0 15px 0; font-size: 16px; display: block;
  }

  .group-header {
    display: grid; grid-template-columns: 2fr 1fr; padding: 15px; font-weight: 800;
    background: rgba(99,102,241,0.15); color: var(--primary);
  }
  .detail-row {
    display: grid; grid-template-columns: 1.1fr 0.6fr 0.9fr 1fr; padding: 12px 10px;
    font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center;
  }
  .col-center { text-align: center; } .col-right { text-align: right; }

  .fifo-active  { border-left: 5px solid var(--success) !important; background: rgba(16,185,129,0.12) !important; }
  .fifo-partial { border-left: 5px solid var(--warning) !important; background: rgba(245,158,11,0.12) !important; }

  .action-btn { padding: 6px 8px; border-radius: 8px; border: none; font-size: 12px; cursor: pointer; margin-left: 4px; }
  .btn-edit { background: var(--warning); color: #000; }
  .btn-del  { background: var(--danger); color: #fff; }

  .payment-batch { background: rgba(255,255,255,0.03); margin: 6px 0; border-radius: 12px; overflow: hidden; }
  .batch-summary {
    display: grid; grid-template-columns: 2fr 1fr; padding: 13px 15px; cursor: pointer;
    font-weight: 600; border-left: 3px solid var(--primary); font-size: 14px;
  }
  .empty { color: var(--text-muted); text-align: center; padding: 30px 10px; }
  .credit { color: var(--success); font-weight: 700; }
</style>
</head>
<body>
<div class="container">

  <div id="banner"></div>

  <!-- HOME -->
  <div id="p-home" class="page active">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h1 style="margin:0; font-weight:800; font-size:24px;">Family Log</h1>
      <button class="btn-sync" onclick="sync()">&#128260; Sincronizza</button>
    </div>
    <div class="card menu-card" onclick="nav('inserimento')"><h2>&#10133; Registra Ore</h2></div>
    <div class="card menu-card" onclick="nav('riepilogo')"><h2>&#128202; Da Saldare</h2></div>
    <div class="card menu-card" onclick="nav('storico')"><h2>&#128220; Storico Pagamenti</h2></div>
    <div class="card menu-card" onclick="nav('setup')"><h2>&#9881;&#65039; Configurazione</h2></div>
  </div>

  <!-- INSERIMENTO -->
  <div id="p-inserimento" class="page">
    <button class="btn-back" onclick="nav('home')">&larr; Indietro</button>
    <div class="card">
      <label>Collaboratore</label>
      <select id="ins-chi"></select>
      <label>Data</label>
      <input type="date" id="ins-data">
      <label>Ore lavorate</label>
      <input type="number" id="ins-ore" step="0.5" min="0" placeholder="Es: 4.5">
      <button class="btn-main" id="btn-save" onclick="saveData()">SALVA REGISTRAZIONE</button>
    </div>
  </div>

  <!-- RIEPILOGO -->
  <div id="p-riepilogo" class="page">
    <button class="btn-back" onclick="nav('home')">&larr; Indietro</button>
    <div id="content-riepilogo"></div>
  </div>

  <!-- STORICO -->
  <div id="p-storico" class="page">
    <button class="btn-back" onclick="nav('home')">&larr; Indietro</button>
    <div id="content-storico"></div>
  </div>

  <!-- SETUP -->
  <div id="p-setup" class="page">
    <button class="btn-back" onclick="nav('home')">&larr; Indietro</button>
    <div class="card">
      <h3 style="margin-top:0">Nuovo Collaboratore</h3>
      <input type="text" id="new-nome" placeholder="Nome">
      <input type="number" id="new-paga" step="0.5" min="0" placeholder="Paga &euro;/h">
      <button class="btn-main" onclick="addCollab()">AGGIUNGI</button>
      <div id="list-collabs" style="margin-top:20px"></div>
    </div>
  </div>

</div>

<script>
var db = { logs: [], collabs: [] };

/* ---------- Wrapper Promise su google.script.run ---------- */
function call(fn, arg) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (e) { reject(e && e.message ? e.message : String(e)); })
      [fn](arg);
  });
}

/* ---------- Banner di stato ---------- */
function banner(txt, tipo, autoHide) {
  var b = document.getElementById('banner');
  b.className = tipo || '';
  b.innerText = txt;
  b.style.display = 'block';
  if (autoHide) setTimeout(function () { b.style.display = 'none'; }, 2200);
}

/* ---------- Helper ---------- */
function fmtData(s) {
  if (!s) return '-';
  var p = String(s).split('-');
  if (p.length !== 3) return s;
  return p[2] + '/' + p[1] + '/' + p[0].slice(2);
}
function safeKey(s) { return String(s).replace(/[^a-zA-Z0-9]/g, ''); }
function esc(s) { return String(s).replace(/'/g, "\\'"); }

/* ---------- Sincronizzazione ---------- */
function sync() {
  banner('Sincronizzazione...');
  return call('getData')
    .then(function (data) {
      db = data;
      banner('Sincronizzato &#10003;'.replace('&#10003;', '\u2713'), 'ok', true);
      var att = document.querySelector('.page.active').id;
      if (att === 'p-riepilogo') renderRiepilogo();
      if (att === 'p-storico') renderStorico();
      if (att === 'p-setup') renderCollabs();
    })
    .catch(function (err) { banner('Errore: ' + err, 'err'); });
}

/* ---------- Navigazione ---------- */
function nav(p) {
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
  document.getElementById('p-' + p).classList.add('active');
  window.scrollTo(0, 0);

  if (p === 'riepilogo') renderRiepilogo();
  if (p === 'storico') renderStorico();
  if (p === 'setup') renderCollabs();
  if (p === 'inserimento') {
    document.getElementById('ins-chi').innerHTML =
      db.collabs.map(function (c) { return '<option value="' + c.nome + '">' + c.nome + '</option>'; }).join('');
    document.getElementById('ins-data').valueAsDate = new Date();
    document.getElementById('ins-ore').value = '';
  }
}

/* ---------- Registrazione ore ---------- */
function saveData() {
  var nome = document.getElementById('ins-chi').value;
  var data = document.getElementById('ins-data').value;
  var ore = parseFloat(document.getElementById('ins-ore').value);

  if (!nome) { alert('Seleziona un collaboratore.'); return; }
  if (!data) { alert('Seleziona una data.'); return; }
  if (!ore || ore <= 0) { alert('Inserisci un numero di ore valido.'); return; }

  var col = db.collabs.filter(function (c) { return c.nome === nome; })[0];
  if (!col) { alert('Collaboratore non trovato.'); return; }

  document.getElementById('btn-save').disabled = true;
  banner('Salvataggio...');

  call('registraOre', { nome: nome, data: data, ore: ore, prezzo: col.paga })
    .then(function (r) { return sync().then(function () { banner(r.msg, 'ok', true); nav('home'); }); })
    .catch(function (err) { banner('Errore: ' + err, 'err'); })
    .then(function () { document.getElementById('btn-save').disabled = false; });
}

/* ---------- Riepilogo da saldare ---------- */
function renderRiepilogo() {
  var cont = document.getElementById('content-riepilogo');
  var pending = db.logs.filter(function (l) { return l.saldato !== 'SI' && l.residuo !== 0; });

  var grouped = {};
  pending.forEach(function (l) { (grouped[l.nome] = grouped[l.nome] || []).push(l); });

  var html = '<h2>Da Saldare</h2>';
  var vuoto = true;

  for (var nome in grouped) {
    vuoto = false;
    var righe = grouped[nome];
    var tot = righe.reduce(function (s, l) { return s + l.residuo; }, 0);
    var k = safeKey(nome);

    html += '<div class="card" style="padding:0; overflow:hidden;">' +
      '<div class="group-header"><span>' + nome + '</span>' +
      '<span class="col-right">' + tot.toFixed(2) + '&euro;</span></div><div>';

    righe.forEach(function (l) {
      var isCredito = l.residuo < 0;
      html += '<div class="detail-row row-' + k + '" data-val="' + l.residuo + '">' +
        '<span>' + fmtData(l.data) + '</span>' +
        '<span class="col-center">' + l.ore + 'h</span>' +
        '<span class="col-right' + (isCredito ? ' credit' : '') + '">' + l.residuo.toFixed(2) + '&euro;</span>' +
        '<div style="text-align:right">' +
          (isCredito ? '' :
            '<button class="action-btn btn-edit" onclick="editRecord(\'' + l.id + '\')">&#9998;</button>') +
          '<button class="action-btn btn-del" onclick="deleteRecord(\'' + l.id + '\')">&#128465;</button>' +
        '</div></div>';
    });

    html += '</div><div style="padding:15px; background:rgba(0,0,0,0.2); display:flex; gap:10px;">' +
      '<input type="number" id="pay-' + k + '" placeholder="Somma da pagare" style="margin:0; flex:1" ' +
      'oninput="highlightFIFO(\'' + k + '\', this.value)">' +
      '<button class="btn-main" style="width:auto; padding:0 20px" ' +
      'onclick="eseguiPagamento(\'' + esc(nome) + '\', \'' + k + '\')">PAGA</button>' +
      '</div></div>';
  }

  cont.innerHTML = vuoto ? '<h2>Da Saldare</h2><div class="empty">Tutto saldato! &#127881;</div>' : html;
}

/* ---------- Anteprima FIFO ---------- */
function highlightFIFO(k, val) {
  var rows = document.querySelectorAll('.row-' + k);
  var b = parseFloat(val) || 0;
  for (var i = 0; i < rows.length; i++) {
    var costo = parseFloat(rows[i].getAttribute('data-val'));
    rows[i].classList.remove('fifo-active', 'fifo-partial');
    if (b <= 0 || costo <= 0) continue;
    if (b >= costo - 0.005) { rows[i].classList.add('fifo-active'); b -= costo; }
    else { rows[i].classList.add('fifo-partial'); b = 0; }
  }
}

/* ---------- Pagamento ---------- */
function eseguiPagamento(nome, k) {
  var imp = parseFloat(document.getElementById('pay-' + k).value);
  if (!imp || imp <= 0) { alert('Inserisci un importo valido.'); return; }
  if (!confirm('Registrare un pagamento di ' + imp.toFixed(2) + ' \u20AC per ' + nome + '?')) return;

  banner('Registrazione pagamento...');
  call('pagamentoFifo', { nome: nome, importoVersato: imp })
    .then(function (r) { return sync().then(function () { banner(r.msg, 'ok', true); }); })
    .catch(function (err) { banner('Errore: ' + err, 'err'); });
}

/* ---------- Elimina ---------- */
function deleteRecord(id) {
  if (!confirm('Eliminare questa registrazione?')) return;
  banner('Eliminazione...');
  call('eliminaOre', { id: id })
    .then(function (r) { return sync().then(function () { banner(r.msg, 'ok', true); }); })
    .catch(function (err) { banner('Errore: ' + err, 'err'); });
}

/* ---------- Modifica ---------- */
function editRecord(id) {
  var rec = db.logs.filter(function (l) { return l.id === id; })[0];
  if (!rec) return;

  var nO = prompt('Nuove ore:', rec.ore);
  if (nO === null) return;
  nO = parseFloat(nO);
  if (!nO || nO <= 0) { alert('Ore non valide.'); return; }

  var nD = prompt('Nuova data (AAAA-MM-GG):', rec.data);
  if (!nD) return;

  banner('Aggiornamento...');
  call('modificaOre', { id: id, nuoveOre: nO, nuovaData: nD, prezzo: rec.prezzo })
    .then(function (r) { return sync().then(function () { banner(r.msg, 'ok', true); }); })
    .catch(function (err) { banner('Errore: ' + err, 'err'); });
}

/* ---------- Storico ---------- */
function renderStorico() {
  var cont = document.getElementById('content-storico');
  var done = db.logs.filter(function (l) { return l.pagatoEffettivo > 0; });

  var grouped = {};
  done.forEach(function (l) { (grouped[l.nome] = grouped[l.nome] || []).push(l); });

  var html = '<h2>Storico Pagamenti</h2>';
  var vuoto = true;

  for (var nome in grouped) {
    vuoto = false;
    var byDate = {};
    grouped[nome].forEach(function (l) { (byDate[l.dataPagamento] = byDate[l.dataPagamento] || []).push(l); });

    html += '<div class="group-header" style="margin-top:12px; border-radius:14px 14px 0 0">' +
      '<span>' + nome + '</span><span></span></div>';

    var date = Object.keys(byDate).sort().reverse();
    date.forEach(function (d) {
      var tot = byDate[d].reduce(function (s, l) { return s + l.pagatoEffettivo; }, 0);
      var id = 'h-' + safeKey(nome) + safeKey(d);
      html += '<div class="payment-batch">' +
        '<div class="batch-summary" onclick="toggle(\'' + id + '\')">' +
        '<span>&#128197; Pagato il ' + fmtData(d) + '</span>' +
        '<span class="col-right">' + tot.toFixed(2) + '&euro;</span></div>' +
        '<div id="' + id + '" style="display:none; background:rgba(0,0,0,0.2)">';
      byDate[d].forEach(function (l) {
        html += '<div class="detail-row" style="grid-template-columns:1fr 1fr 1fr; opacity:.85">' +
          '<span>Lav. ' + fmtData(l.data) + '</span>' +
          '<span class="col-center">' + l.ore + 'h</span>' +
          '<span class="col-right">' + l.pagatoEffettivo.toFixed(2) + '&euro;</span></div>';
      });
      html += '</div></div>';
    });
  }

  cont.innerHTML = vuoto ? '<h2>Storico Pagamenti</h2><div class="empty">Nessun pagamento registrato.</div>' : html;
}

function toggle(id) {
  var e = document.getElementById(id);
  e.style.display = (e.style.display === 'block') ? 'none' : 'block';
}

/* ---------- Collaboratori ---------- */
function addCollab() {
  var n = document.getElementById('new-nome').value.trim();
  var p = parseFloat(document.getElementById('new-paga').value);
  if (!n) { alert('Inserisci il nome.'); return; }
  if (!p || p <= 0) { alert('Inserisci una paga oraria valida.'); return; }

  banner('Salvataggio...');
  call('addCollaboratore', { nome: n, paga: p })
    .then(function (r) {
      document.getElementById('new-nome').value = '';
      document.getElementById('new-paga').value = '';
      return sync().then(function () { banner(r.msg, 'ok', true); });
    })
    .catch(function (err) { banner('Errore: ' + err, 'err'); });
}

function renderCollabs() {
  document.getElementById('list-collabs').innerHTML =
    db.collabs.length
      ? db.collabs.map(function (c) {
          return '<div class="card" style="margin-bottom:6px; padding:12px">' +
                 c.nome + ' &mdash; ' + Number(c.paga).toFixed(2) + '&euro;/h</div>';
        }).join('')
      : '<div class="empty">Nessun collaboratore.</div>';
}

window.onload = sync;
</script>
</body>
</html>
